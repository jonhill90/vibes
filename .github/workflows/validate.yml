name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt
      - run: python -m pip install -r tests/requirements-dev.txt
      - run: python scripts/validate_repository.py
      - run: python scripts/reconcile_skills.py --check
      - run: python -m unittest discover -s tests -v

  orphan-check:
    # jonhill90/skills#162: advisory only. The roster this compares against
    # lives in a different repository (agent-dotfiles), so this job can
    # never be authoritative and must never gate a merge -- a red run here
    # means "look", not "fix required". continue-on-error must live on the
    # STEP, not the job (jonhill90/skills#219): job-level continue-on-error
    # only keeps the overall *workflow run* green -- the job's own check-run
    # conclusion still reports failure, which is what a PR's merge-state
    # rollup and `gh pr checks` read, so job-level continue-on-error alone
    # left every PR touching this repo permanently UNSTABLE. Step-level
    # continue-on-error is what actually flips the job's check-run to
    # success (with a neutral/warning annotation) while the script's own
    # exit code stays meaningful in the log (0 clean, 1 orphans found, 2
    # could not check).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Report skills neither rostered nor benched in agent-dotfiles
        continue-on-error: true
        run: python scripts/check_orphan_skills.py

  plugin-conformance:
    # Validate `plugin.json` against the PUBLISHED Agent Plugins schema, not
    # against this repository's transcription of it. `tests/test_plugin_manifest.py`
    # encodes the same constraints offline and is the fast local guard; this
    # job is the independent instrument, for the same reason `spec-conformance`
    # exists alongside `validate_repository.py` (jonhill90/skills#159, #150).
    #
    # The manifest schema is CLOSED, so a misspelled or extra key is a hard
    # failure for every conformant client. Fetching the live schema is the
    # point: if agent-plugins.org changes it, this repository needs telling.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema
      - name: Validate plugin.json against the published schema
        run: |
          python - <<'PY'
          import json, sys, urllib.request
          from jsonschema import Draft202012Validator

          URL = "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json"
          with urllib.request.urlopen(URL) as response:
              schema = json.load(response)
          manifest = json.load(open("plugin.json"))

          Draft202012Validator.check_schema(schema)
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest), key=lambda e: list(e.path))
          for error in errors:
              print(f"plugin.json: {list(error.path)}: {error.message}", file=sys.stderr)
          print(f"validated plugin.json against {schema['$id']}: {len(errors)} error(s)")
          sys.exit(1 if errors else 0)
          PY

  spec-conformance:
    # Validate every skill with the specification's OWN reference tool, not
    # only ours. Our validator was previously checked by reading the spec and
    # comparing it to our code — same author, same reading, no independent
    # instrument (jonhill90/skills#150). This job is that instrument.
    #
    # It tracks agentskills main rather than a pinned commit on purpose: a
    # failure here means either a real conformance bug of ours or a spec that
    # moved, and both are things this repository needs told about.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the spec's reference validator
        run: |
          git clone --depth 1 https://github.com/agentskills/agentskills.git "$RUNNER_TEMP/agentskills"
          python -m pip install "$RUNNER_TEMP/agentskills/skills-ref"
          skills-ref --version
      - name: Validate every skill against the reference implementation
        run: |
          status=0
          for skill in skills/*/; do
            if ! skills-ref validate "$skill"; then
              status=1
            fi
          done
          exit $status
